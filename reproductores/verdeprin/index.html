<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>clara</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="el-contenedoruwu">
  <p> me empeñe en hacerlo parecer old, solo presioona los 3 puntos y quedate ahi </p>
</div>

<img src="fotos/erizo.gif" class="erizo-gif">

<div class="player-box">

     <!-- Menú de tema -->
    <div class="menu-tema">
        <button id="menu-btn">⋮</button>

        <div id="menu-opciones" class="oculto">
            <button onclick="cambiarTema()">cambiar de tema (me haria la nonchalant diciendo qe el verde es mejor pero no en relaidad el otro esta mejor pequeña niña rata presionala yo se que quieres) </button>
        </div>
    </div>

    <!-- Barra superior -->
    <div class="header">
    cancionero
 </div>


    <div class="main">

        <!-- PANEL IZQUIERDO -->
        <div class="left-panel">

            <img src="fotos/cover.png" class="cover">

            <div class="info-box">
                <div class="inner">
                    <span id="title">Título</span>
                </div>
            </div>

            <div class="info-box">
                <div class="inner">
                    <span id="artist">Artista</span>
                </div>
            </div>

        </div>

        <!-- PANEL CENTRAL -->
        <div class="right-panel">

            <img src="fotos/cd.png" class="cd">

            <!-- Volumen -->
            <div class="volume">

                <button id="vol-down">−</button>

                <div class="vol-bar">
                    <div id="vol-level"></div>
                </div>

                <button id="vol-up">+</button>

            </div>

            <!-- Botones -->
            <div class="buttons">

                <button id="prev">⏮</button>
                <button id="play">▶</button>
                <button id="pause">⏸</button>
                <button id="next">⏭</button>

                <button id="back10">⟲</button>
                <button id="forward10">⟳</button>
                <button id="shuffle">⇄</button>

            </div>

            <!-- Barra -->
            <div class="progress-container">
                <div id="progress"></div>
            </div>

            <!-- Tiempo -->
            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

        </div>

        <!-- PANEL DERECHO -->
        <div class="playlist-panel">

            <div class="playlist" id="playlist"></div>

            <!-- LETRA -->
            <div class="lyrics-box" id="lyrics-box" style="display:none;">

    <div class="lyrics-header">

        <button id="back-playlist">◄</button>

        <span>letra</span>

    </div>

    <pre id="lyrics"></pre>

</div>

        </div>

    </div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>

</body>
</html>
